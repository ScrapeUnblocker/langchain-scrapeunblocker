[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-scrapeunblocker"
dynamic = ["version"]
description = "LangChain tools for ScrapeUnblocker: read any web page as Markdown or JSON, search Google, run 100+ site scrapers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["langchain", "scraping", "web-scraping", "agents", "llm", "serp", "markdown", "tools"]
authors = [{ name = "ScrapeUnblocker", email = "info@scrapeunblocker.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["langchain-core>=0.3.0,<2.0.0", "scrapeunblocker>=0.19.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "langchain-tests==1.1.9"]

[project.urls]
Homepage = "https://scrapeunblocker.com?utm_source=pypi&utm_medium=integration&utm_campaign=langchain"
Documentation = "https://github.com/ScrapeUnblocker/langchain-scrapeunblocker#readme"
Source = "https://github.com/ScrapeUnblocker/langchain-scrapeunblocker"
Issues = "https://github.com/ScrapeUnblocker/langchain-scrapeunblocker/issues"

[tool.hatch.version]
path = "src/langchain_scrapeunblocker/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_scrapeunblocker"]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
