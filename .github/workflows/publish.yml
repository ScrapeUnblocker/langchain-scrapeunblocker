name: Publish to PyPI

# Publishes on every GitHub Release through PyPI Trusted Publishing (OIDC):
# no API token anywhere. The trusted publisher points at this repo, this
# workflow (publish.yml) and the environment "pypi".

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]" && pytest
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
